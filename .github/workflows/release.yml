name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip jq

      - name: Validate manifest
        run: |
          jq empty package.json
          test "$(jq -r '.contributes.scripts[0].path' package.json)" = "./save-hooks.lua"

      - name: Validate Lua syntax
        run: luac5.4 -p save-hooks.lua

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -r '.version' package.json)"

          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match package.json version ($package_version)." >&2
            exit 1
          fi

      - name: Build extension
        id: package
        shell: bash
        run: |
          version="$(jq -r '.version' package.json)"
          tag="v${version}"
          asset="aseprite-save-and-${version}.aseprite-extension"

          mkdir -p dist/package
          cp package.json save-hooks.lua LICENSE dist/package/

          (
            cd dist/package
            zip -r "../${asset}" package.json save-hooks.lua LICENSE
          )

          rm -rf dist/package
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-save-and-${{ github.sha }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ASSET: ${{ steps.package.outputs.asset }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            "dist/${RELEASE_ASSET}#Aseprite Save & Run extension" \
            --target "$GITHUB_SHA" \
            --title "Aseprite Save & Run $RELEASE_TAG" \
            --generate-notes
