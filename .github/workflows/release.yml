name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip jq

      - name: Validate manifest
        run: |
          jq empty package.json
          test "$(jq -r '.contributes.scripts[0].path' package.json)" = "./save-hooks.lua"

      - name: Validate Lua syntax
        run: luac5.4 -p save-hooks.lua

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -r '.version' package.json)"

          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match package.json version ($package_version)." >&2
            exit 1
          fi

      - name: Build extension
        id: package
        shell: bash
        run: |
          version="$(jq -r '.version' package.json)"
          asset="aseprite-save-and-${version}.aseprite-extension"

          mkdir -p dist/package
          cp package.json save-hooks.lua LICENSE dist/package/

          (
            cd dist/package
            zip -r "../${asset}" package.json save-hooks.lua LICENSE
          )

          rm -rf dist/package
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-save-and-${{ github.sha }}
          path: dist/${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Aseprite Save & Run $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Upload extension to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ steps.package.outputs.asset }}" \
            --clobber
